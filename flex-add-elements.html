<!DOCTYPE html>
<html> <head> <style>
    .flex-container {
      display: flex;  flex-direction:row;
      background-color: red;
  }

.flex-container > div {  /*div children of the flex container*/
  background-color: #f1f1f1; 
  margin: 10px;  padding: 20px;  font-size: 30px;
}

/* Responsive layout */
@media (max-width: 600px) { 
	 .flex-container{
		 flex-direction:column;
		 background-color: green;
	  }
	}

.divlist{
	color: orange;
}
</style></head>

<title>List of things</title>

<h2>Dau builds list with divs</h2>

<body>
		<div class="flex-container" id="target">
		  <div class="divlist">row item 1</div>   
		  <div class="divlist">row item 2</div>  
		  <div class="divlist">row item 3</div>  
		</div>
	
	<p> Press the button to create an new element of type div and then add it to the container.
	</p>
	
	<input type="text" id="itemInput">
	<button onclick="makeNewDiv()">Add end</button>

	<button onclick="addFront()">Add front</button>
	<button onclick="removeEveryOther()">Remove</button>


	
	
</body>
<script>
	function makeNewDiv(){
		/* make the div and its text */
		let element = document.createElement("div")

		let inputValue = document.getElementById("itemInput").value;

		element.innerHTML = inputValue;
		element.className = "divlist";

		/* add it to the container */
		let container = document.getElementById('target')
		container.appendChild(element)
		
	}

	function addFront(){
		let element = document.createElement("div");

		let inputValue = document.getElementById("itemInput").value;

		element.innerHTML = inputValue;
		element.className = "divlist";

		let container = document.getElementById("target");

		container.insertBefore(element, container.firstChild);

	}

	function removeEveryOther(){
		let divListItems = document.getElementsByClassName("divlist");

		let length = divListItems.length;

		for (let i = length - 1; i >= 0; i -= 2){
			divListItems[i].remove();
		}
	}

</script>
</html>
