<script>
    let ids = ["location0", "location1", "location2",
        "location3", "location4", "location5", 
        "location6", "location7", "location8",
        "location9", "location10", "location11",
        "location12", "location13", "location14",
        "location15", "location16", "location17",
        "location18", "location19", "location20",
        "location21", "location22", "location23",
        "location24", "location25", "location26",
        "location27", "location28", "location29",
        "location30", "location31", "location32",
        "location33", "location34", "location35",
    ];

    let score = 0;
    let locationsVisited = 0;
    let lastLocation = 0;

    function randomLocattions(){
        let positions = [];

        for (let i = 0; i < 36; i++){
            positions.push(i);
        }

        for (let i = positions.length - 1; i > 0; i--){
            let j = Math.floor(Math.randomo() * (i * 1));

            let temp = positions[i];
            positions[i] = positions[j];
            positions[j] = temp;
        }
        return positions;
    }

    let positions = randomLocations();

    let poisonLocation = positions[0];
    let roseLocation = positions[1];
    let lilyLocations = [positions[2], positions[3]];
    let daisyLocations = [
        positions[4], positions[5], positions[6], positions[7], positions[8]
    ];

    function moveRose(playerPosition){
        let directions = [-6, 6, -1, 1];

        while(true){
            let directionIndex = Math.floor(Math.random() * 4);
            let move = directions[directionIndex];

            let newPosition = roseLocation + move;

            if (newPosition < 0 || newPosition >= 36){
                continue;
            }
            
            if (move === -1 && roseLocation % 6 === 0){
                continue;
            }

            if (move === 1 && roseLocation % 6 === 5){
                continue;
            }

            roseLocation = newPosition;

            if(roseLocation === playerPosition){
                gameOver = true;
                document.getLementById("help").innerHTML = "The rose caught you! Game Over."
            }

            break;
        }



    }

 
    let gameOver = false;

    function check(position) {
        if(gameOver) {
            return;
        }

        let imageId = ids[position];

        let image = document.getElementById(imageId);

        if (position == poisonLocation) {
            image.src = "poison ivy.jpg";
            image.onclick = null;
        }

        else if (position == roseLocation){
            image.src = "rose.jpg";
            image.onclick = null;
            score += 4;
        }
        else if (lilyLocations.includes(position)){
            image.src = "lily.jpg";
            image.onclick = null;
            score += 2;
        }

        else if (daisyLocations.includes(position)) {
            image.src = "daisy.jpg";
            image.onclick = null;
            score += 1;
        }

        locationsVisited++;

        document.getElementById("locations").innerHTML = 
            "Number of locations checked is " + locationsVisited
            + ".";

        if (position == poisonLocation) {
            gameOver = true;
            score -= 4;
        }

        document.getElementById("score").innerHTML = 
            "score is " + score + ".";

        lastLocation = position;
        moveRose(position);

    }

    function help() {
        let neighbors = [
            (lastLocation - 1 + 36) % 36,
            (lastLocation + 1) % 36,
            (lastLocation - 6 + 36) % 36,
            (lastLocation + 6) % 36
        ];

        for (let i = 0; i < neighbors.length; i++){
            if (daisyLocations.includes(neighbors[i])) {
                document.getElementById("help").innerHTML = "cold";
                return "cold";
            } 
        }

        let row = Math.floor(lastLocation / 6);
        let col = lastLocation % 6;

        for (let r = row - 1; r <= row + 1; r++){
            for (let c = col - 1; c <= col + 1; c++){
                if(r >= 0 && r < 6 && c >= 0 && c < 6){
                    let location = r * 6 + c;

                    if (location == roseLocation){
                        document.getElementById("help").innerHTML =
                        "hot";
                        return "hot";
                    }
                }
            }
        }

        for (let r = row - 1; r <= row + 1; r++){
            for (let c = col - 1; c <= col + 1; c++){
                if (r >= 0 && r < 6 && c >= 0 && c < 6){
                    let location = r * 6 + c;

                    if(location == poisonLocation){
                        document.getElementById("help").innerHTML =
                        "watch out";
                        return "watch out";
                    }
                }
            }
        }

        document.getElementById("help").innerHTML = "warm";
        return "warm";
    }
